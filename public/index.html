<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="dark" />
  <meta name="theme-color" content="#060609" />
  <title>Oson Birja</title>
  <meta name="description" content="UZEX tovar birjasi uchun AI agent: vazifani ayting — agent tovarni topadi, tanlaydi va buyurtmani tayyorlaydi." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><defs><radialGradient id='g'><stop offset='0' stop-color='%23ffffff'/><stop offset='.35' stop-color='%23f062b4'/><stop offset='1' stop-color='%234f6bff'/></radialGradient></defs><circle cx='16' cy='16' r='13' fill='%23060609' stroke='url(%23g)' stroke-width='3'/><circle cx='16' cy='16' r='3' fill='url(%23g)'/></svg>" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="top">
    <div class="brand"><span class="logo-slot" id="logoSlot" aria-hidden="true"></span><span class="brand-name">Oson<span class="dot">·</span>Birja</span><span class="badge" title="Birjaga yuborish demo rejimida">DEMO</span></div>
    <nav class="seg" aria-label="Bo'limlar">
      <button data-tab="agent" class="active">Agent</button>
      <button data-tab="prices">Narxlar</button>
      <button data-tab="lots">Sotuvda</button>
      <button data-tab="orders">Buyurtmalar <span class="count" id="orderCount" hidden></span></button>
    </nav>
    <div class="right">
      <button class="icon-btn" id="voiceToggle" title="Agent ovozi" aria-pressed="true" aria-label="Agent ovozi">🔊</button>
      <div class="langs" role="group" aria-label="Til">
        <button data-lang="uz" class="active">UZ</button><button data-lang="ru">RU</button><button data-lang="en">EN</button>
      </div>
    </div>
  </header>

  <main>
    <!-- ================= AGENT ================= -->
    <section class="view agent-view active" data-view="agent">
      <div class="stage" id="stage">
        <div class="stage-slot" id="stageSlot" data-state="idle" aria-hidden="true"></div>
        <div class="intro" id="intro">
          <p class="intro-text" id="introText"></p>
          <div class="examples" id="examples"></div>
        </div>
      </div>
      <div class="feed" id="feed" aria-live="polite"></div>
    </section>

    <!-- ================= NARXLAR ================= -->
    <section class="view page" data-view="prices">
      <h1 class="page-title">Birja narxlari <span>haftalik kotirovkalar · uzex.uz</span></h1>
      <form class="search" id="priceForm" role="search">
        <input id="priceQ" type="search" placeholder="Masalan: sement, benzin, un, armatura" autocomplete="off" />
        <button class="btn" type="submit">Izlash</button>
      </form>
      <div class="cats" id="priceCats"></div>
      <div class="hint" id="priceInfo"></div>
      <div class="grid" id="priceList"></div>
      <h2 class="sub-title">Oxirgi 10 savdo kuni</h2>
      <div class="grid mini-grid" id="dailyList"></div>
    </section>

    <!-- ================= SOTUVDA ================= -->
    <section class="view page" data-view="lots">
      <h1 class="page-title">Birjadagi takliflar <span>kotirovkalash varag'i · uzex.uz</span></h1>
      <form class="search" id="lotForm" role="search">
        <input id="lotQ" type="search" placeholder="Nima kerak? Masalan: sement" autocomplete="off" />
        <select id="lotRegion" aria-label="Hudud"><option value="">Barcha hududlar</option></select>
        <select id="lotSort" aria-label="Saralash"><option value="new">Eng yangi</option><option value="cheap">Eng arzon</option></select>
        <button class="btn" type="submit">Izlash</button>
      </form>
      <div class="cats" id="lotChips"></div>
      <div class="hint" id="lotInfo"></div>
      <div class="grid" id="lotList"></div>
    </section>

    <!-- ================= BUYURTMALAR ================= -->
    <section class="view page" data-view="orders">
      <h1 class="page-title">Buyurtmalarim <span>agent tayyorlagan xaridlar</span></h1>
      <div class="profile-card" id="profileCard"></div>
      <div class="orders" id="orderList"></div>
    </section>
  </main>

  <!-- Vazifa kiritish -->
  <div class="composer-wrap" id="composerWrap">
    <form class="composer" id="composer">
      <button type="button" class="mic" id="micBtn" aria-label="Ovoz bilan vazifa berish" title="Ovoz bilan ayting"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 1 0-6 0v6a3 3 0 0 0 3 3Zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-2.08A7 7 0 0 0 19 12h-2Z"/></svg></button>
      <button type="button" class="rec-btn rec-cancel" id="recCancel" aria-label="Yozuvni bekor qilish" title="Bekor qilish"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.4 5 5 6.4 10.6 12 5 17.6 6.4 19l5.6-5.6 5.6 5.6 1.4-1.4-5.6-5.6L19 6.4 17.6 5 12 10.6z"/></svg></button>
      <input id="taskInput" autocomplete="off" />
      <canvas class="wave" id="wave" aria-hidden="true"></canvas>
      <button type="button" class="rec-btn rec-stop" id="recStop" aria-label="Yozishni to'xtatish va matnni tahrirlash" title="To'xtatish (matnni tahrirlash)"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="7" y="7" width="10" height="10" rx="2"/></svg></button>
      <button type="submit" class="send" id="sendBtn" aria-label="Yuborish"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4l7 7-1.4 1.4L13 7.8V20h-2V7.8l-4.6 4.6L5 11z"/></svg></button>
    </form>
    <div class="caption" id="caption">Ma'lumotlar: uzex.uz (real vaqt) · Birjaga yuborish — DEMO rejimi</div>
  </div>

  <!-- Modal oyna (lot, narx, ariza) -->
  <div class="modal" id="modal" hidden>
    <div class="modal-backdrop" data-close></div>
    <div class="modal-body" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="modal-head"><div><div class="modal-title" id="modalTitle"></div><div class="hint" id="modalSub"></div></div><button class="icon-btn" data-close aria-label="Yopish">✕</button></div>
      <div id="modalContent"></div>
    </div>
  </div>

  <div class="toast" id="toast" hidden></div>
  <!-- Avatar: bitta canvas logo va markaz orasida "uchadi" -->
  <canvas id="avatar" class="avatar-fly" role="img" aria-label="Oson AI agent avatari"></canvas>
  <script src="avatar.js"></script>
  <script src="speech.js"></script>
  <script src="app.js"></script>
</body>
</html>
